<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AkshatPlay – Watch & Upload Videos</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
--bg:#0f0f0f;--text:#fff;--sec:#272727;--brand:#ff3d00;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:var(--bg);color:var(--text)}

header{
position:fixed;top:0;width:100%;height:56px;
display:flex;justify-content:space-between;align-items:center;
padding:0 16px;background:var(--bg);border-bottom:1px solid var(--sec);z-index:10
}
.left,.mid,.right{display:flex;align-items:center;gap:14px}
.logo{color:#fff;text-decoration:none;font-size:20px;font-weight:bold}
.logo i{color:var(--brand)}

.search{flex:1;max-width:500px;height:40px;border:1px solid var(--sec);
border-radius:40px;padding:0 16px;background:#121212;color:#fff}

.profile{
width:32px;height:32px;border-radius:50%;overflow:hidden
}
.profile img{
width:100%;height:100%;object-fit:cover
}

.sidebar{
position:fixed;top:56px;left:0;width:220px;height:calc(100vh - 56px);
padding:12px
}
.nav{padding:10px;border-radius:8px;cursor:pointer}
.nav:hover{background:var(--sec)}

.main{
margin-left:220px;margin-top:56px;padding:20px
}
.grid{
display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px
}
.card{cursor:pointer}
.thumb{
aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#333
}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{display:flex;gap:10px;margin-top:10px}
.ch-icon{
width:36px;height:36px;border-radius:50%;overflow:hidden
}
.ch-icon img{width:100%;height:100%;object-fit:cover}

footer{text-align:center;margin:40px 0;color:#888}
</style>
</head>

<body>

<header>
<div class="left">
<i class="fa-solid fa-bars"></i>
<a class="logo"><i class="fa-solid fa-play"></i>AkshatPlay</a>
</div>

<div class="mid">
<input class="search" placeholder="Search videos">
</div>

<div class="right">
<i class="fa-solid fa-video"></i>
<i class="fa-solid fa-bell"></i>
<div class="profile">
<img src="me.jpg">
</div>
</div>
</header>

<div class="sidebar">
<div class="nav"><i class="fa-solid fa-house"></i> Home</div>
<div class="nav"><i class="fa-solid fa-bolt"></i> Shorts</div>
<div class="nav"><i class="fa-solid fa-clock"></i> Watch Later</div>
</div>

<div class="main">
<div class="grid" id="grid"></div>

<footer>
© 2025 AkshatPlay<br>
<strong>founder – akshat sinha</strong>
</footer>
</div>

<script>
const grid=document.getElementById("grid");

for(let i=1;i<=12;i++){
grid.innerHTML+=`
<div class="card">
<div class="thumb">
<img src="me.jpg">
</div>
<div class="info">
<div class="ch-icon">
<img src="me.jpg">
</div>
<div>
<b>Sample Video ${i}</b><br>
<span style="color:#aaa;font-size:14px">AkshatPlay • 1 day ago</span>
</div>
</div>
</div>`;
}
</script>

</body>
</html>
